<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B101C"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#8E1712"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <radialGradient id="glow-shield" cx="120" cy="140" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A52" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262D" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="360" fill="url(#bg-grad)" rx="16"/>
  <rect width="1280" height="360" fill="url(#dot-grid)" rx="16"/>
  <rect width="1280" height="360" fill="none" stroke="#21262D" stroke-width="1.5" rx="16"/>

  <!-- Subtle Shield Glow -->
  <circle cx="120" cy="140" r="180" fill="url(#glow-shield)"/>

  <!-- Left: Geometric Shield + AST Invariant Mark -->
  <g transform="translate(60, 65)">
    <!-- Shield Outer Poly -->
    <polygon points="60,5 115,22 115,95 60,145 5,95 5,22" fill="#131824" stroke="url(#shield-grad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Shield Inner Facet -->
    <polygon points="60,18 102,32 102,88 60,128 18,88 18,32" fill="#0D131F" stroke="#30363D" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- AST Invariant Nodes inside Shield -->
    <!-- Root Node -->
    <line x1="60" y1="42" x2="38" y2="72" stroke="#58A6FF" stroke-width="2"/>
    <line x1="60" y1="42" x2="82" y2="72" stroke="#58A6FF" stroke-width="2"/>
    <line x1="38" y1="72" x2="60" y2="102" stroke="#3FB950" stroke-width="1.8"/>
    <line x1="82" y1="72" x2="60" y2="102" stroke="#3FB950" stroke-width="1.8"/>

    <circle cx="60" cy="42" r="6" fill="#090D16" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="38" cy="72" r="5" fill="#090D16" stroke="#F85149" stroke-width="2.2"/>
    <circle cx="82" cy="72" r="5" fill="#090D16" stroke="#3FB950" stroke-width="2.2"/>

    <!-- Invariant Core Balance Diamond -->
    <polygon points="60,94 68,102 60,110 52,102" fill="#3FB950"/>
  </g>

  <!-- Center-Left: Main Typography & Badges -->
  <g transform="translate(210, 60)">
    <!-- Top Pill: Independent Verification Specification -->
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#3FB950"/>
    <text x="24" y="16" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">ADVERSARIAL AST VERIFIER</text>
    <text x="206" y="16" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">v0.2.0</text>

    <!-- Main Title: CORDIS -->
    <text x="0" y="72" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="3">CORDIS</text>

    <!-- Subtitle -->
    <text x="0" y="108" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">The Independent Adversarial AI-PR &amp; AST Invariant Prosecutor</text>

    <!-- Tech Spec Meta line -->
    <text x="0" y="136" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">100% Python 3.10+ Stdlib &#8226; Sub-5ms Execution &#8226; Deterministic 3-Gate Prosecution</text>
  </g>

  <!-- Bottom Row: 4 Clean Telemetry Pills -->
  <g transform="translate(60, 230)">
    <!-- Pill 1: AST Functions -->
    <g transform="translate(0, 0)">
      <rect width="272" height="74" rx="10" fill="#121722" stroke="#388BFD" stroke-width="1.2"/>
      <circle cx="32" cy="37" r="14" fill="#0D1A2D"/>
      <path d="M26 42 L32 30 L38 42 Z" fill="none" stroke="#58A6FF" stroke-width="1.8"/>
      <text x="56" y="29" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">AST AUDIT CORPUS</text>
      <text x="56" y="52" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">22,595 Functions</text>
    </g>

    <!-- Pill 2: Catch Rate -->
    <g transform="translate(296, 0)">
      <rect width="272" height="74" rx="10" fill="#18131B" stroke="#F85149" stroke-width="1.2"/>
      <circle cx="32" cy="37" r="14" fill="#2B1316"/>
      <path d="M26 31 L38 43 M38 31 L26 43" stroke="#F85149" stroke-width="2"/>
      <text x="56" y="29" fill="#F85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">COUNTERFEIT CATCH</text>
      <text x="56" y="52" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">100% Caught (5/5)</text>
    </g>

    <!-- Pill 3: False Positives -->
    <g transform="translate(592, 0)">
      <rect width="272" height="74" rx="10" fill="#101A17" stroke="#2EA043" stroke-width="1.2"/>
      <circle cx="32" cy="37" r="14" fill="#0D2417"/>
      <path d="M25 37 L30 42 L39 31" fill="none" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="29" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">FALSE POSITIVES</text>
      <text x="56" y="52" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">0.0% Verified</text>
    </g>

    <!-- Pill 4: Dependencies -->
    <g transform="translate(888, 0)">
      <rect width="272" height="74" rx="10" fill="#161524" stroke="#8957E5" stroke-width="1.2"/>
      <circle cx="32" cy="37" r="14" fill="#201836"/>
      <path d="M25 32 L32 28 L39 32 L39 41 L32 45 L25 41 Z" fill="none" stroke="#BC8CFF" stroke-width="1.8"/>
      <text x="56" y="29" fill="#BC8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">EXTERNAL BLOAT</text>
      <text x="56" y="52" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Zero Dependencies</text>
    </g>
  </g>
</svg>