<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="chart-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="bar-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E6A03"/>
      <stop offset="100%" stop-color="#D29922"/>
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <pattern id="chart-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1F242C"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#chart-bg)" rx="14"/>
  <rect width="1200" height="420" fill="url(#chart-grid)" rx="14"/>
  <rect width="1200" height="420" fill="none" stroke="#21262D" stroke-width="1.5" rx="14"/>

  <!-- Main Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">EMPIRICAL BENCHMARK &amp; REPOSITORY FORENSICS</text>
    <text x="0" y="20" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">22,595 AST Functions Audited Across 6 Real Open-Source Repositories (Human vs. AI-Agent)</text>
  </g>

  <!-- Left Card: Adversarial Bug Catch Rate (Width: 540) -->
  <g transform="translate(40, 80)">
    <rect width="535" height="305" rx="10" fill="#111622" stroke="#30363D" stroke-width="1.2"/>
    <text x="20" y="30" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Adversarial Bug Catch Rate</text>
    <text x="20" y="48" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">5 Benchmark Scenarios (Single-Input Overfit, Mock Bypass, Inverted Logic)</text>

    <!-- Bar 1: Standard pytest -->
    <g transform="translate(20, 75)">
      <text x="0" y="14" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Standard pytest / CI</text>
      <text x="495" y="14" fill="#F85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">0% (0 / 5)</text>
      <rect x="0" y="22" width="495" height="14" rx="4" fill="#1C1F26"/>
      <rect x="0" y="22" width="6" height="14" rx="3" fill="#F85149"/>
      <text x="0" y="50" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Blind to counterfeit tests, mocks, and single-input overfits</text>
    </g>

    <!-- Bar 2: Naive git revert (FixProof) -->
    <g transform="translate(20, 145)">
      <text x="0" y="14" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Naive git revert (FixProof-style)</text>
      <text x="495" y="14" fill="#D29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">20% (1 / 5)</text>
      <rect x="0" y="22" width="495" height="14" rx="4" fill="#1C1F26"/>
      <rect x="0" y="22" width="99" height="14" rx="4" fill="url(#bar-amber)"/>
      <text x="0" y="50" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Fooled by single-input overfits; fails on refactors &amp; optimizations</text>
    </g>

    <!-- Bar 3: Cordis Prosecutor -->
    <g transform="translate(20, 215)">
      <text x="0" y="14" fill="#58A6FF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Cordis 3-Gate Prosecutor</text>
      <text x="495" y="14" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">100% (5 / 5)</text>
      <rect x="0" y="22" width="495" height="14" rx="4" fill="#1C1F26"/>
      <rect x="0" y="22" width="495" height="14" rx="4" fill="url(#bar-green)"/>
      <text x="0" y="50" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">Catches 100% via AST mutation + differential fuzzing (sub-5ms)</text>
    </g>
  </g>

  <!-- Right Card: Live GitHub Telemetry: Classic vs AI Repos (Width: 545) -->
  <g transform="translate(615, 80)">
    <rect width="545" height="305" rx="10" fill="#111622" stroke="#30363D" stroke-width="1.2"/>
    <text x="20" y="30" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Classic Human vs. AI-Agent Repositories</text>
    <text x="20" y="48" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">python-dotenv, boltons, click vs. fastmcp, smolagents, nao-mgs-workflow</text>

    <!-- Metric 1: Mock Density -->
    <g transform="translate(20, 68)">
      <rect width="505" height="66" rx="8" fill="#161B26" stroke="#21262D" stroke-width="1"/>
      <text x="14" y="24" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Mock Density (@patch / MagicMock)</text>
      <text x="14" y="48" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Human: <tspan fill="#3FB950" font-weight="700">1.2%</tspan> &#8226; AI-Agent: <tspan fill="#F85149" font-weight="700">43.6%</tspan></text>
      
      <!-- Right Badge -->
      <rect x="365" y="16" width="126" height="26" rx="6" fill="#2B1316" stroke="#F85149" stroke-width="0.8"/>
      <text x="428" y="33" fill="#F85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">36&#215; MOCK INFLATION</text>
    </g>

    <!-- Metric 2: AST Mutant Survival Rate -->
    <g transform="translate(20, 144)">
      <rect width="505" height="66" rx="8" fill="#161B26" stroke="#21262D" stroke-width="1"/>
      <text x="14" y="24" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">AST Mutant Survival Rate (Hollow Tests)</text>
      <text x="14" y="48" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Human: <tspan fill="#3FB950" font-weight="700">15.0%</tspan> &#8226; AI-Agent: <tspan fill="#F85149" font-weight="700">29.6%</tspan></text>

      <!-- Right Badge -->
      <rect x="365" y="16" width="126" height="26" rx="6" fill="#2B1E13" stroke="#D29922" stroke-width="0.8"/>
      <text x="428" y="33" fill="#E3B341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">2.0&#215; SURVIVAL GAP</text>
    </g>

    <!-- Metric 3: AI Attribution Rate -->
    <g transform="translate(20, 220)">
      <rect width="505" height="66" rx="8" fill="#161B26" stroke="#21262D" stroke-width="1"/>
      <text x="14" y="24" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">AI Attribution Rate (Co-Authored-By / Bot Author)</text>
      <text x="14" y="48" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Human: <tspan fill="#8B949E" font-weight="700">0.0%</tspan> &#8226; AI-Agent: <tspan fill="#58A6FF" font-weight="700">54.4%</tspan> (up to 86.7%)</text>

      <!-- Right Badge -->
      <rect x="365" y="16" width="126" height="26" rx="6" fill="#121D2C" stroke="#388BFD" stroke-width="0.8"/>
      <text x="428" y="33" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">DOMINANT CODEBASE</text>
    </g>
  </g>
</svg>